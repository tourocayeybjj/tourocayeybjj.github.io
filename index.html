 de Puerto Rico</p>\n</div>\n<div class=\"c6\" style=\"display: grid; border-top: 2px solid var(--fg)\">\n<sc-for list=\"{{week}}\" as=\"d\" hint-placeholder-count=\"6\">\n<div class=\"day\" data-today=\"{{d.today}}\" data-empty=\"{{d.empty}}\" style=\"padding: 18px 16px 24px; min-height: 260px; display: flex; flex-direction: column; gap: 22px; border-right: 1px solid var(--hair)\">\n<h3 style=\"margin: 0; font-weight: 900; font-stretch: 125%; font-size: 19px; line-height: 1; text-transform: uppercase; display: flex; align-items: center; gap: 10px\"><span aria-label=\"{{d.full}}\">{{d.short}}</span><sc-if value=\"{{d.today}}\" hint-placeholder-val=\"{{false}}\"><span style=\"font: 700 10px ui-monospace, Menlo, monospace; letter-spacing: 0.08em; background: #111111; color: #FFFFFF; padding: 3px 6px\">HOY</span></sc-if></h3>\n<sc-for list=\"{{d.classes}}\" as=\"c\" hint-placeholder-count=\"1\">\n<a class=\"cls\" href=\"#reserva\" onClick=\"{{c.pick}}\" data-kind=\"{{c.kind}}\" data-dim=\"{{c.dim}}\" data-next=\"{{c.next}}\" aria-label=\"{{c.aria}}\">\n<span class=\"tm dsp\" style=\"font-size: 34px; font-variant-numeric: tabular-nums\">{{c.hour}}<span style=\"font-size: 14px\"> PM</span></span>\n<span class=\"lbl\">{{c.label}} \u00b7 {{c.gi}}</span>\n<span class=\"lbl\" style=\"opacity: .7\">{{c.dur}}</span>\n<span class=\"go\">{{c.tag}} <span aria-hidden=\"true\">\u2192</span></span>\n</a>\n</sc-for>\n<sc-if value=\"{{d.empty}}\" hint-placeholder-val=\"{{false}}\"><p class=\"lbl\" style=\"color: var(--mut)\">Sin clases</p></sc-if>\n</div>\n</sc-for>\n</div>\n<p style=\"margin: 24px 0 0; font-size: 15px; color: var(--mut)\">El horario puede cambiar en d\u00edas feriados. Confirma por WhatsApp o Instagram antes de venir.</p>\n</section>\n\n<section id=\"primera\" class=\"sec k\" aria-labelledby=\"first-h\">\n<div class=\"head\">\n<h2 class=\"dsp h2\" id=\"first-h\">Tu primera clase.</h2>\n<div role=\"group\" aria-label=\"Tipo de clase\" class=\"seg\"><button type=\"button\" aria-pressed=\"{{wearGi}}\" onClick=\"{{setGi}}\">Clase con gi</button><button type=\"button\" aria-pressed=\"{{wearNogi}}\" onClick=\"{{setNogi}}\">Clase No-Gi</button></div>\n</div>\n<ol class=\"c4\" style=\"margin: 0; padding: 0; list-style: none; display: grid; gap: 32px\">\n<li style=\"border-top: 1px solid var(--rule); padding-top: 24px; display: flex; flex-direction: column; gap: 10px\"><span class=\"dsp\" aria-hidden=\"true\" style=\"font-size: 48px; color: #D62B20\">1</span><h3 style=\"margin: 0; font-size: 19px; line-height: 1.25\">Escr\u00edbenos</h3><p style=\"margin: 0; color: var(--mut)\">Dinos qu\u00e9 d\u00eda vienes. Contestamos por WhatsApp o Instagram.</p></li>\n<li style=\"border-top: 1px solid var(--rule); padding-top: 24px; display: flex; flex-direction: column; gap: 10px\"><span class=\"dsp\" aria-hidden=\"true\" style=\"font-size: 48px; color: #D62B20\">2</span><h3 style=\"margin: 0; font-size: 19px; line-height: 1.25\">Llega 10 minutos antes</h3><p style=\"margin: 0; color: var(--mut)\">Para saludar, cambiarte y conocer al coach.</p></li>\n<li style=\"border-top: 1px solid var(--rule); padding-top: 24px; display: flex; flex-direction: column; gap: 10px\"><span class=\"dsp\" aria-hidden=\"true\" style=\"font-size: 48px; color: #D62B20\">3</span><h3 style=\"margin: 0; font-size: 19px; line-height: 1.25\">{{wearTitle}}</h3><p aria-live=\"polite\" style=\"margin: 0; color: var(--mut)\">{{wearText}}</p></li>\n<li style=\"border-top: 1px solid var(--rule); padding-top: 24px; display: flex; flex-direction: column; gap: 10px\"><span class=\"dsp\" aria-hidden=\"true\" style=\"font-size: 48px; color: #D62B20\">4</span><h3 style=\"margin: 0; font-size: 19px; line-height: 1.25\">Entrena a tu ritmo</h3><p style=\"margin: 0; color: var(--mut)\">Descansa cuando lo necesites. Tu segunda clase tambi\u00e9n es gratis.</p></li>\n</ol>\n<div class=\"c2\" style=\"display: grid; gap: 48px clamp(24px, 5vw, 72px); margin-top: clamp(56px, 7vw, 96px); align-items: start\">\n<div>\n<p class=\"lbl\" style=\"color: var(--acc)\">Antes de salir de casa</p>\n<h3 class=\"dsp h3\" style=\"margin: 12px 0 22px\">Tu bulto, listo.</h3>\n<div role=\"group\" aria-label=\"Lista para tu primera clase\" style=\"border-bottom: 1px solid var(--hair)\">\n<sc-for list=\"{{packList}}\" as=\"it\" hint-placeholder-count=\"5\"><button class=\"ck\" type=\"button\" aria-pressed=\"{{it.on}}\" onClick=\"{{it.pick}}\"><span class=\"box\" aria-hidden=\"true\">{{it.mark}}</span><span class=\"txt\">{{it.label}}</span></button></sc-for>\n</div>\n<div class=\"bar\" aria-hidden=\"true\"><i style=\"width: {{packPct}}\"></i></div>\n<p role=\"status\" style=\"margin: 12px 0 0; font-weight: 700\">{{packStatus}}</p>\n</div>\n<details class=\"rules\">\n<summary style=\"padding: 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px\"><span style=\"display: flex; flex-direction: column; gap: 12px\"><span class=\"lbl\" style=\"color: var(--acc)\">Las reglas del mat</span><span class=\"dsp h3\">10 reglas, cero drama.</span></span><span class=\"btn line\" style=\"pointer-events: none; white-space: nowrap; flex: none; min-height: 44px; padding: 8px 14px\">Ver reglas</span></summary>\n<ol class=\"rgrid\" style=\"margin: 22px 0 0; padding: 0; list-style: none; display: grid; column-gap: 32px\">\n<li class=\"rule\"><span class=\"n\">1</span><strong>Respeto a todos</strong><span style=\"color: var(--mut)\">Instructores, compa\u00f1eros, padres y visitantes.</span></li>\n<li class=\"rule\"><span class=\"n\">2</span><strong>Academia limpia</strong><span style=\"color: var(--mut)\">Un espacio limpio, seguro y acogedor.</span></li>\n<li class=\"rule\"><span class=\"n\">3</span><strong>Sin zapatos en el mat</strong><span style=\"color: var(--mut)\">Qu\u00edtatelos antes de entrar.</span></li>\n<li class=\"rule\"><span class=\"n\">4</span><strong>Buena higiene</strong><span style=\"color: var(--mut)\">Gi o ropa limpia, u\u00f1as cortas, desodorante.</span></li>\n<li class=\"rule\"><span class=\"n\">5</span><strong>Cubre cortes y heridas</strong><span style=\"color: var(--mut)\">Limpios y bien cubiertos.</span></li>\n<li class=\"rule\"><span class=\"n\">6</span><strong>Sin joyer\u00eda</strong><span style=\"color: var(--mut)\">Ni relojes, collares, aretes ni anillos.</span></li>\n<li class=\"rule\"><span class=\"n\">7</span><strong>S\u00e9 puntual</strong><span style=\"color: var(--mut)\">Llega con tiempo para cambiarte.</span></li>\n<li class=\"rule\"><span class=\"n\">8</span><strong>Haz tap a tiempo</strong><span style=\"color: var(--mut)\">Sumisiones con control; suelta en cuanto hagan tap.</span></li>\n<li class=\"rule\"><span class=\"n\">9</span><strong>S\u00e9 buen compa\u00f1ero</strong><span style=\"color: var(--mut)\">Ayuda a los nuevos y anima a los dem\u00e1s.</span></li>\n<li class=\"rule\"><span class=\"n\">10</span><strong>Divi\u00e9rtete y mejora</strong><span style=\"color: var(--mut)\">Trabaja duro y mantente humilde.</span></li>\n</ol>\n</details>\n</div>\n</section>\n\n<section id=\"coaches\" class=\"sec g\" aria-labelledby=\"coach-h\">\n<div class=\"head\">\n<h2 class=\"dsp h2\" id=\"coach-h\">Tus coaches.</h2>\n<p>Touro Cayey BJJ es parte de la Asociaci\u00f3n Carlson Gracie.</p>\n</div>\n<div class=\"c3\" style=\"display: grid; gap: 40px clamp(24px, 4vw, 56px)\">\n<article style=\"border-top: 2px solid var(--fg); padding-top: 26px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start\">\n<div aria-hidden=\"true\" style=\"display: flex; width: 100%; max-width: 240px; height: 14px\"><span style=\"flex: 1; background: #5B3A26\"></span><span style=\"width: 48px; background: #111111\"></span><span style=\"width: 24px; background: #5B3A26\"></span></div>\n<h3 class=\"dsp\" translate=\"no\" style=\"font-size: clamp(30px, 3.2vw, 48px)\">\u00c1ngel Otero</h3>\n<p class=\"lbl\" style=\"color: var(--acc)\">Cintur\u00f3n marr\u00f3n \u00b7 Due\u00f1o \u00b7 Profesor</p>\n<p style=\"margin: 0; color: var(--mut)\">Due\u00f1o de Touro Cayey BJJ y profesor de las clases de adultos y teens.</p>\n</article>\n<article style=\"border-top: 2px solid var(--fg); padding-top: 26px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start\">\n<div aria-hidden=\"true\" style=\"display: flex; width: 100%; max-width: 240px; height: 14px\"><span style=\"flex: 1; background: #111111\"></span><span style=\"width: 48px; background: #D62B20\"></span><span style=\"width: 24px; background: #111111\"></span></div>\n<h3 class=\"dsp\" translate=\"no\" style=\"font-size: clamp(30px, 3.2vw, 48px)\">H\u00e9ctor Rivera</h3>\n<p class=\"lbl\" style=\"color: var(--acc)\">Cintur\u00f3n negro \u00b7 Profesor</p>\n<p style=\"margin: 0; color: var(--mut)\">Profesor de la clase de adultos.</p>\n</article>\n<article style=\"border-top: 2px solid var(--fg); padding-top: 26px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start\">\n<div aria-hidden=\"true\" style=\"display: flex; width: 100%; max-width: 240px; height: 14px\"><span style=\"flex: 1; background: #1F4FA3\"></span><span style=\"width: 48px; background: #111111\"></span><span style=\"width: 24px; background: #1F4FA3\"></span></div>\n<h3 class=\"dsp\" translate=\"no\" style=\"font-size: clamp(30px, 3.2vw, 48px)\">Diego Correa</h3>\n<p class=\"lbl\" style=\"color: var(--acc)\">Cintur\u00f3n azul \u00b7 Asistente</p>\n<p style=\"margin: 0; color: var(--mut)\">Asistente de la clase de teens.</p>\n</article>\n</div>\n</section>\n\n<section id=\"comunidad\" class=\"sec k\" aria-labelledby=\"ig-h\">\n<div class=\"head\">\n<div>\n<p class=\"lbl\" style=\"margin-bottom: 14px; color: var(--acc)\">La comunidad \u00b7 lo \u00faltimo en Instagram</p>\n<h2 class=\"dsp\" id=\"ig-h\" translate=\"no\" style=\"text-transform: none; font-size: clamp(32px, 5.4vw, 80px)\">@tourocayeybjj</h2>\n</div>\n<a class=\"btn line\" href=\"https://www.instagram.com/tourocayeybjj/\">Seguir en Instagram <span class=\"ar\" aria-hidden=\"true\">\u2197</span></a>\n</div>\n<div class=\"ig\" style=\"display: grid; gap: 10px\">\n<a class=\"igl big\" href=\"https://www.instagram.com/p/Df3R6sJh_Fy/\"><img class=\"shot\" src=\"assets/ig-team.jpg\" alt=\"El equipo de Touro Cayey BJJ en gi, frente a las banderas de Puerto Rico, Brasil y Jap\u00f3n\" width=\"1269\" height=\"952\" loading=\"lazy\" style=\"display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%\"><span aria-hidden=\"true\">17 nov<em class=\"vp\"> \u00b7 Ver post</em> \u2197</span></a>\n<a class=\"igl tall\" href=\"https://www.instagram.com/p/DfSV0bMlCxC/\"><img class=\"shot\" src=\"assets/ig-nogi.jpg\" alt=\"Entrenamiento No-Gi: un compa\u00f1ero con el rash guard de Touro controla desde arriba\" width=\"980\" height=\"1225\" loading=\"lazy\" style=\"display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%\"><span aria-hidden=\"true\">3 nov<em class=\"vp\"> \u00b7 Ver post</em> \u2197</span></a>\n<a class=\"igl tall\" href=\"https://www.instagram.com/p/DfU3fEMlB9O/\"><img class=\"shot\" src=\"assets/ig-roll.jpg\" alt=\"Dos compa\u00f1eros haciendo sparring en el mat\" width=\"952\" height=\"1269\" loading=\"lazy\" style=\"display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%\"><span aria-hidden=\"true\">4 nov<em class=\"vp\"> \u00b7 Ver post</em> \u2197</span></a>\n</div>\n</section>\n\n<section id=\"competencia\" class=\"sec g\" aria-labelledby=\"comp-h\">\n<div class=\"head\">\n<h2 class=\"dsp h2\" id=\"comp-h\">Tambi\u00e9n competimos.</h2>\n<p>Competir es opcional. Si quieres hacerlo, aqu\u00ed tienes equipo para prepararte.</p>\n</div>\n<div role=\"group\" aria-label=\"Ver medallas de\" class=\"seg\" style=\"margin-bottom: clamp(32px, 4vw, 48px)\">\n<button type=\"button\" aria-pressed=\"{{compTouro}}\" onClick=\"{{setCompTouro}}\">Touro \u00b7 2025</button><button type=\"button\" aria-pressed=\"{{compTeam}}\" onClick=\"{{setC     const inner = t.slice(he + 1, j - 9); const list = get(sc, head.match(/list="\{\{(.+?)\}\}"/)[1]) || []; const as = head.match(/as="(\w+)"/)[1];
